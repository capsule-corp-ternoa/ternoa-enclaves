services:
  # Edge router: only does TCP SNI routing with TLS passthrough.
  traefik:
    image: traefik:v3.6.10
    container_name: traefik_sgx_edge
    command:
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      # IMPORTANT: no ACME here – TLS & ACME stay inside enclaves
    ports:
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - sgx-machine

  # =========================
  # ENCLAVE 1 (c3n1v3)
  # =========================
  ternoa-sgx-c3n1v3:
    image: "capsulecorpternoa/ternoa-sgx:v0.5.3-rc3-mainnet"
    container_name: ternoa_sgx_c3n1v3
    command:
      - "--domain"
      - "mainnet-c3n1v3.ternoa.network"
      - "--port"
      - "8301"
      - "--verbose"
      - "3"
      - "--rpcnode"
      - "wss://mainnet.ternoa.network"
    # 443: internal ACME bootstrap
    # 8301: actual TLS server
    expose:
      - "443"
    ports:
      - "8301:8301"
    volumes:
      - /opt/ternoa/c3n1v3/nft:/opt/ternoa-enclaves/nft
      - /opt/ternoa/c3n1v3/certificates:/opt/ternoa-enclaves/certificates
    networks:
      - sgx-machine
    dns:
      - 8.8.8.8
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.c3n1v3.rule=HostSNI(`mainnet-c3n1v3.ternoa.network`)"
      - "traefik.tcp.routers.c3n1v3.entrypoints=websecure"
      - "traefik.tcp.routers.c3n1v3.tls.passthrough=true"
      - "traefik.tcp.services.c3n1v3.loadbalancer.server.port=443"

  # =========================
  # ENCLAVE 2 (c3n2v3)
